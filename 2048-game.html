    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #ffe6f0 0%, #e0f3ff 50%, #e6ffe6 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(236, 72, 153, 0.2);
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --board-bg: #dbeafe;
            --cell-empty: rgba(255, 255, 255, 0.72);
            --accent-pink: #ec4899;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #1f1024 0%, #0f172a 50%, #0b221a 100%);
            --card-bg: rgba(30, 41, 59, 0.92);
            --card-border: rgba(236, 72, 153, 0.3);
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --board-bg: #1e293b;
            --cell-empty: rgba(51, 65, 85, 0.65);
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .back-link {
            text-decoration: none;
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .theme-btn {
            background: rgba(59, 130, 246, 0.12);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .scores {
            display: flex;
            gap: 0.5rem;
        }

        .score-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.12), rgba(59, 130, 246, 0.12));
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.4rem 0.75rem;
            text-align: center;
            min-width: 72px;
        }

        .score-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        .score-value {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 0.45rem;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 0.5rem 0.85rem;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue));
            color: #fff;
        }

        .btn-secondary {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        body.dark .btn-secondary {
            color: #34d399;
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .board-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--board-bg);
            border-radius: 18px;
            padding: 10px;
            touch-action: none;
            user-select: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
        }

        .tile {
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.65rem;
            background: var(--cell-empty);
            color: var(--text-color);
            transition: transform 0.12s ease, background 0.15s ease;
        }

        .tile[data-val="2"]    { background: #fce7f3; color: #9d174d; }
        .tile[data-val="4"]    { background: #dbeafe; color: #1e40af; }
        .tile[data-val="8"]    { background: #d1fae5; color: #065f46; }
        .tile[data-val="16"]   { background: #f9a8d4; color: #831843; }
        .tile[data-val="32"]   { background: #93c5fd; color: #1e3a8a; }
        .tile[data-val="64"]   { background: #6ee7b7; color: #064e3b; }
        .tile[data-val="128"]  { background: #ec4899; color: #fff; font-size: 1.4rem; }
        .tile[data-val="256"]  { background: #3b82f6; color: #fff; font-size: 1.4rem; }
        .tile[data-val="512"]  { background: #10b981; color: #fff; font-size: 1.4rem; }
        .tile[data-val="1024"] { background: linear-gradient(135deg, #ec4899, #3b82f6); color: #fff; font-size: 1.15rem; }
        .tile[data-val="2048"] { background: linear-gradient(135deg, #ec4899, #3b82f6, #10b981); color: #fff; font-size: 1.15rem; box-shadow: 0 0 18px rgba(236, 72, 153, 0.5); }
        .tile.big { background: #0f172a; color: #f8fafc; font-size: 1.05rem; }

        .tile.pop {
            animation: popIn 0.16s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(4px);
            border-radius: 18px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
        }

        .overlay.active {
            display: flex;
        }

        .overlay h2 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .hint {
            margin-top: 0.85rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="https://games.mahsua.com/" class="back-link">🏠 Home</a>
            <button class="theme-btn" id="themeToggle" type="button">🌙 Dark</button>
            </div>
        </div>

        <div class="header">
            <h1>2048</h1>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="bestScore">0</div>
                </div>
            </div>
        </div>

        <div class="controls-row">
            <span class="subtitle">Join numbers to reach <strong>2048</strong>!</span>
            <div class="btn-group">
                <button class="btn btn-secondary" id="undoBtn" type="button" disabled>Undo</button>
                <button class="btn btn-primary" id="newGameBtn" type="button">New Game</button>
            </div>
        </div>

        <div class="board-wrap" id="boardWrap">
            <div class="grid" id="grid"></div>
            <div class="overlay" id="overlay">
                <h2 id="overlayTitle">Game Over!</h2>
                <p id="overlayMsg">No more moves left.</p>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="keepPlayingBtn" type="button" style="display:none;">Keep Playing</button>
                    <button class="btn btn-primary" id="retryBtn" type="button">Play Again</button>
                </div>
            </div>
        </div>

        <p class="hint">Swipe anywhere on the board (mobile) or use Arrow keys / WASD (desktop).</p>
    </div>

    <script>
        const SIZE = 4;
        let board = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('mahsua_2048_best') || '0', 10);
        let prevState = null;
        let won = false;
        let keepPlaying = false;

        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');
        const undoBtn = document.getElementById('undoBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const keepPlayingBtn = document.getElementById('keepPlayingBtn');
        const retryBtn = document.getElementById('retryBtn');
        const boardWrap = document.getElementById('boardWrap');
        const themeToggle = document.getElementById('themeToggle');

        bestScoreEl.textContent = bestScore;

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
        });

        function initGame() {
            board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
            score = 0;
            prevState = null;
            won = false;
            keepPlaying = false;
            undoBtn.disabled = true;
            overlay.classList.remove('active');
            keepPlayingBtn.style.display = 'none';
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const empty = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) empty.push([r, c]);
                }
            }
            if (!empty.length) return false;
            const [r, c] = empty[Math.floor(Math.random() * empty.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
            return true;
        }

        function render() {
            gridEl.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = board[r][c];
                    const tile = document.createElement('div');
                    tile.className = 'tile' + (val > 2048 ? ' big' : '');
                    if (val > 0) {
                        tile.dataset.val = val;
                        tile.textContent = val;
                        tile.classList.add('pop');
                    }
                    gridEl.appendChild(tile);
                }
            }
            scoreEl.textContent = score;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('mahsua_2048_best', String(bestScore));
                bestScoreEl.textContent = bestScore;
            }
        }

        function slideRow(row) {
            const filtered = row.filter(v => v !== 0);
            let gained = 0;
            for (let i = 0; i < filtered.length - 1; i++) {
                if (filtered[i] === filtered[i + 1]) {
                    filtered[i] *= 2;
                    gained += filtered[i];
                    filtered[i + 1] = 0;
                    if (filtered[i] === 2048 && !won) {
                        won = true;
                    }
                }
            }
            const merged = filtered.filter(v => v !== 0);
            while (merged.length < SIZE) merged.push(0);
            return { row: merged, gained };
        }

        function rotateClockwise(mat) {
            return mat[0].map((_, c) => mat.map(row => row[c]).reverse());
        }

        function move(dir) {
            if (overlay.classList.contains('active')) return;
            const snapshot = {
                board: board.map(r => [...r]),
                score
            };

            let working = board.map(r => [...r]);
            const rotations = { left: 0, down: 1, right: 2, up: 3 }[dir];
            for (let i = 0; i < rotations; i++) working = rotateClockwise(working);

            let moved = false;
            let gainedTotal = 0;
            for (let r = 0; r < SIZE; r++) {
                const { row: newRow, gained } = slideRow(working[r]);
                if (newRow.some((v, idx) => v !== working[r][idx])) moved = true;
                working[r] = newRow;
                gainedTotal += gained;
            }

            for (let i = 0; i < (4 - rotations) % 4; i++) working = rotateClockwise(working);

            if (!moved) return;

            prevState = snapshot;
            undoBtn.disabled = false;
            board = working;
            score += gainedTotal;
            addRandomTile();
            render();

            if (won && !keepPlaying) {
                overlayTitle.textContent = 'You Reached 2048!';
                overlayMsg.textContent = 'Great job! Want to keep going for a higher score?';
                keepPlayingBtn.style.display = 'inline-block';
                overlay.classList.add('active');
            } else if (!canMove()) {
                overlayTitle.textContent = 'Game Over!';
                overlayMsg.textContent = 'Final Score: ' + score;
                keepPlayingBtn.style.display = 'none';
                overlay.classList.add('active');
            }
        }

        function canMove() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) return true;
                    if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return true;
                    if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return true;
                }
            }
            return false;
        }

        undoBtn.addEventListener('click', () => {
            if (!prevState) return;
            board = prevState.board.map(r => [...r]);
            score = prevState.score;
            prevState = null;
            undoBtn.disabled = true;
            overlay.classList.remove('active');
            render();
        });

        newGameBtn.addEventListener('click', initGame);
        retryBtn.addEventListener('click', initGame);
        keepPlayingBtn.addEventListener('click', () => {
            keepPlaying = true;
            overlay.classList.remove('active');
        });

        window.addEventListener('keydown', (e) => {
            const keyMap = {
                ArrowLeft: 'left', a: 'left', A: 'left',
                ArrowRight: 'right', d: 'right', D: 'right',
                ArrowUp: 'up', w: 'up', W: 'up',
                ArrowDown: 'down', s: 'down', S: 'down'
            };
            if (keyMap[e.key]) {
                e.preventDefault();
                move(keyMap[e.key]);
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        boardWrap.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        boardWrap.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
            if (Math.abs(dx) > Math.abs(dy)) {
                move(dx > 0 ? 'right' : 'left');
            } else {
                move(dy > 0 ? 'down' : 'up');
            }
        }, { passive: true });

        initGame();
    </script>

</style>
<button type="button" id="mahsua-exit-fs">✕ Exit Fullscreen</button>
<script>
  (function() {
    var fsBtns = document.querySelectorAll('.mahsua-fs-inline, #mahsuaFsBtn');
    var exitBtn = document.getElementById('mahsua-exit-fs');
    function isNativeFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function enterFull() {
      document.body.classList.add('mahsua-fullscreen');
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }
    function exitFull() {
      document.body.classList.remove('mahsua-fullscreen');
      if (isNativeFull()) {
        if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
    fsBtns.forEach(function(b) {
      b.addEventListener('click', function() {
        if (document.body.classList.contains('mahsua-fullscreen') || isNativeFull()) exitFull();
        else enterFull();
      });
    });
    if (exitBtn) exitBtn.addEventListener('click', exitFull);
    function onNativeChange() {
      if (!isNativeFull()) document.body.classList.remove('mahsua-fullscreen');
    }
    document.addEventListener('fullscreenchange', onNativeChange);
    document.addEventListener('webkitfullscreenchange', onNativeChange);
  })();
</script>
