    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-gradient: linear-gradient(135deg, #ffe6f0 0%, #e0f3ff 50%, #e6ffe6 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(236, 72, 153, 0.2);
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --accent-pink: #ec4899;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }
        body.dark {
            --bg-gradient: linear-gradient(135deg, #1f1024 0%, #0f172a 50%, #0b221a 100%);
            --card-bg: rgba(30, 41, 59, 0.92);
            --card-border: rgba(236, 72, 153, 0.3);
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 1.2rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
        .back-link { text-decoration: none; color: var(--accent-blue); font-weight: 600; font-size: 0.9rem; }
        .top-actions { display: flex; gap: 0.45rem; }
        .pill-btn {
            background: rgba(59, 130, 246, 0.12); color: var(--text-color);
            border: 1px solid var(--card-border); border-radius: 999px;
            padding: 0.35rem 0.75rem; font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
        }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.65rem; margin-bottom: 0.85rem; }
        h1 {
            font-size: 1.75rem; font-weight: 800;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .stats { display: flex; gap: 0.45rem; }
        .stat-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.12), rgba(59, 130, 246, 0.12));
            border: 1px solid var(--card-border); border-radius: 12px;
            padding: 0.3rem 0.65rem; text-align: center; min-width: 60px;
        }
        .stat-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }
        .stat-value { font-size: 0.98rem; font-weight: 800; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; gap: 0.5rem; }
        .btn {
            border: none; border-radius: 12px; padding: 0.48rem 0.85rem;
            font-family: inherit; font-size: 0.84rem; font-weight: 700; cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue)); color: #fff; }
        .btn-secondary { background: rgba(16, 185, 129, 0.15); color: #059669; border: 1px solid rgba(16, 185, 129, 0.35); }
        body.dark .btn-secondary { color: #34d399; }
        .canvas-wrap {
            position: relative; width: 100%; border-radius: 16px; overflow: hidden;
            border: 2px solid var(--card-border); touch-action: none;
        }
        canvas { display: block; width: 100%; height: auto; }
        .overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            gap: 0.75rem; color: #fff; text-align: center; padding: 1.5rem;
        }
        .overlay.active { display: flex; }
        .touch-controls { display: flex; gap: 0.75rem; margin-top: 0.8rem; }
        .touch-btn {
            flex: 1; padding: 0.7rem; border-radius: 12px; border: 1px solid var(--card-border);
            background: rgba(59, 130, 246, 0.14); color: var(--text-color);
            font-family: inherit; font-size: 0.95rem; font-weight: 700; cursor: pointer;

<body>
    <div class="container">
        <div class="top-bar">
            <a href="./index.html" class="back-link">← All Games</a>
            <div class="top-actions">
                <button class="pill-btn" id="soundToggle" type="button">🔊 Sound</button>
                <button class="pill-btn" id="themeToggle" type="button">🌙 Dark</button>
            </div>
        </div>
        <div class="header">
            <h1>🚲 Bicycle Racing</h1>
            <div class="stats">
                <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
                <div class="stat-box"><div class="stat-label">Best</div><div class="stat-value" id="bestScore">0</div></div>
                <div class="stat-box"><div class="stat-label">Lives</div><div class="stat-value" id="lives">❤️❤️❤️</div></div>
            </div>
        </div>
        <div class="controls-row">
            <span style="font-size:0.84rem;color:var(--text-secondary);">Collect 🪙 coins &amp; dodge traffic!</span>
            <div style="display:flex;gap:0.45rem;">
                <button class="btn btn-secondary" id="pauseBtn" type="button">Pause</button>
                <button class="btn btn-primary" id="restartBtn" type="button">New Ride</button>
            </div>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="bikeCanvas" width="380" height="480"></canvas>
            <div class="overlay active" id="overlay">
                <h2 id="overlayTitle">Bicycle Racing</h2>
                <p id="overlayMsg">Switch lanes to dodge cones &amp; cars!</p>
                <button class="btn btn-primary" id="startBtn" type="button">Start Ride</button>
            </div>
        </div>
        <div class="touch-controls">
            <button class="touch-btn" id="leftBtn" type="button">◀ Left Lane</button>
            <button class="touch-btn" id="rightBtn" type="button">Right Lane ▶</button>
        </div>
        <p class="hint">Use Left/Right arrows, A/D, swipe, or tap the lane buttons.</p>
    </div>
    <script>
        const canvas = document.getElementById('bikeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('bestScore');
        const livesEl = document.getElementById('lives');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const soundToggle = document.getElementById('soundToggle');
        const themeToggle = document.getElementById('themeToggle');
        const canvasWrap = document.getElementById('canvasWrap');

        const LANES = [85, 190, 295];
        let lane = 1;
        let score = 0;
        let best = parseInt(localStorage.getItem('mahsua_bike_best') || '0', 10);
        let lives = 3;
        let speed = 4.5;
        let roadOffset = 0;
        let entities = [];
        let spawnTimer = 0;
        let running = false;
        let paused = false;
        let soundOn = true;

        bestEl.textContent = best;
        let audioCtx = null;
        function beep(freq, dur = 0.06) {
            if (!soundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.07, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + dur);
            } catch (_) {}
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
        });
        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
        });

        function updateHUD() {
            scoreEl.textContent = Math.floor(score);
            livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) || '💔';
            if (Math.floor(score) > best) {
                best = Math.floor(score);
                localStorage.setItem('mahsua_bike_best', String(best));
                bestEl.textContent = best;
            }
        }

        function startRide() {
            lane = 1; score = 0; lives = 3; speed = 4.5;
            entities = []; spawnTimer = 25;
            running = true; paused = false;
            pauseBtn.textContent = 'Pause';
            updateHUD();
            overlay.classList.remove('active');
        }

        startBtn.addEventListener('click', startRide);
        restartBtn.addEventListener('click', startRide);
        pauseBtn.addEventListener('click', () => {
            if (!running) return;
            paused = !paused;
            pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        });

        function moveLane(dir) {
            if (!running || paused) return;
            lane = Math.max(0, Math.min(2, lane + dir));
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); moveLane(-1); }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); moveLane(1); }
        });
        document.getElementById('leftBtn').addEventListener('click', () => moveLane(-1));
        document.getElementById('rightBtn').addEventListener('click', () => moveLane(1));

        let tsX = 0;
        canvasWrap.addEventListener('touchstart', (e) => { tsX = e.touches[0].clientX; }, { passive: true });
        canvasWrap.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - tsX;
            if (Math.abs(dx) > 25) moveLane(dx > 0 ? 1 : -1);
        }, { passive: true });

        function update() {
            if (!running || paused) return;
            score += 0.15;
            speed = Math.min(9.5, 4.5 + score * 0.004);
            roadOffset = (roadOffset + speed) % 40;

            spawnTimer--;
            if (spawnTimer <= 0) {
                const l = Math.floor(Math.random() * 3);
                const isCoin = Math.random() < 0.4;
                entities.push({
                    lane: l, y: -30, isCoin,
                    emoji: isCoin ? '🪙' : (Math.random() < 0.5 ? '🚧' : '🚗'),
                    hit: false
                });
                spawnTimer = Math.max(22, Math.floor(48 - speed * 2));
            }

            const bikeY = canvas.height - 65;
            for (const ent of entities) {
                ent.y += speed;
                if (!ent.hit && ent.lane === lane && Math.abs(ent.y - bikeY) < 34) {
                    ent.hit = true;
                    if (ent.isCoin) {
                        score += 25;
                        beep(720, 0.06);
                    } else {
                        lives--;
                        beep(180, 0.16);
                        if (lives <= 0) {
                            running = false;
                            overlayTitle.textContent = '💥 Crash!';
                            overlayMsg.textContent = 'Final Score: ' + Math.floor(score);
                            startBtn.textContent = 'Ride Again';
                            overlay.classList.add('active');
                        }
                    }
                    updateHUD();
                }
            }
            entities = entities.filter(e => !e.hit && e.y < canvas.height + 40);
            updateHUD();
        }

        function draw() {
            // Grass sides
            ctx.fillStyle = '#10b981';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Road
            ctx.fillStyle = '#334155';
            ctx.fillRect(34, 0, canvas.width - 68, canvas.height);

            // Lane dividers
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 3;
            ctx.setLineDash([22, 18]);
            ctx.lineDashOffset = -roadOffset;
            [138, 242].forEach(x => {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            });
            ctx.setLineDash([]);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '34px sans-serif';
            for (const ent of entities) {
                ctx.fillText(ent.emoji, LANES[ent.lane], ent.y);
            }

            // Player bike
            ctx.font = '40px sans-serif';
            ctx.fillText('🚴', LANES[lane], canvas.height - 65);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>

<!-- Mahsua Floating Home & Fullscreen Bar -->
<style>
  #mahsua-nav-bar {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(236, 72, 153, 0.3);
    box-shadow: 0 6px 20px rgba(15, 23, 42, 0.16);
    backdrop-filter: blur(12px);
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
  }
  body.dark #mahsua-nav-bar,
  body.dark-mode #mahsua-nav-bar {
    background: rgba(15, 23, 42, 0.88);
    border-color: rgba(59, 130, 246, 0.35);
  }
  .mahsua-nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .mahsua-nav-btn:active {
    transform: scale(0.95);
  }
  .mahsua-home-btn {
    background: linear-gradient(135deg, #ec4899, #3b82f6);
    color: #ffffff;
  }
  .mahsua-fs-btn {
    background: linear-gradient(135deg, #10b981, #3b82f6);
    color: #ffffff;
  }
</style>
<div id="mahsua-nav-bar">
  <a href="https://games.mahsua.com/" class="mahsua-nav-btn mahsua-home-btn" title="Go to Mahsua Games Home">🏠 Home</a>
  <button type="button" id="mahsuaFsBtn" class="mahsua-nav-btn mahsua-fs-btn" title="Toggle Full Screen">⛶ Full Screen</button>
</div>
<script>
  (function() {
    var fsBtn = document.getElementById('mahsuaFsBtn');
    if (!fsBtn) return;
    function isFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function updateFsLabel() {
      fsBtn.textContent = isFull() ? '✕ Exit Full' : '⛶ Full Screen';
    }
    fsBtn.addEventListener('click', function() {
      var el = document.documentElement;
      if (!isFull()) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', updateFsLabel);
    document.addEventListener('webkitfullscreenchange', updateFsLabel);
  })();
</script>

</body>
