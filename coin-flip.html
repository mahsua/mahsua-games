    <style>
:root {
    --bg-color: #f0f2f5;
    --primary-color: #ffffff;
    --accent-color: #6a1b9a;
    --gradient-1: #9b51e0;
    --gradient-2: #4a2c7a;
    --text-color: #1c1f30;
    --shadow-color: rgba(0, 0, 0, 0.1);
}

body {
    font-family: 'Poppins', sans-serif;
    background-color: var(--bg-color);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color: var(--text-color);
    overflow: hidden;
}

.container {
    background-color: var(--primary-color);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px var(--shadow-color);
    text-align: center;
    width: 90%;
    max-width: 400px;
    margin: 50px auto 80px;
}

h1 {
    font-size: 2em;
    font-weight: 700;
    margin: 0 0 20px;
    color: var(--accent-color);
}

.coin {
    width: 150px;
    height: 150px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    margin: 30px auto;
}

.side {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2em;
    font-weight: 700;
    color: #fff;
    box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3), 0 5px 15px rgba(0, 0, 0, 0.2);
    background-size: cover;
    background-position: center;
}

.heads {
    background-image: url('assets/coin-flip/HEADS.png');
    transform: rotateY(0deg);
}

.tails {
    background-image: url('assets/coin-flip/TAILS.png');
    transform: rotateY(180deg);
}

.status {
    font-size: 1.2em;
    font-weight: 600;
    margin-top: 20px;
    min-height: 25px;
}

.button {
    padding: 12px 25px;
    border: none;
    border-radius: 50px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 10px var(--shadow-color);
    color: var(--primary-color);
    background-image: linear-gradient(45deg, var(--gradient-1), var(--gradient-2));
    margin-top: 25px;
}

.button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
}

footer {
    background-color: var(--bg-color);
    text-align: center;

    width: 100%;

    bottom: 0;
    left: 0;
    z-index: 100;

    flex-direction: column;
    align-items: center;

}

.footer-links {

.footer-links a {
    color: #555;

    font-size: 0.7em;

<body>
    <div class="container">
        <h1>Coin Flip</h1>
        <div class="coin" id="coin">
            <div class="side heads"></div>
            <div class="side tails"></div>
        </div>
        <div class="status" id="status-message">Click "Flip Coin" to begin!</div>
        <button class="button" id="flip-button">Flip Coin</button>
    </div>

    <footer>
        <div class="footer-links">
            <a href="./index.html">Games</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <div class="footer-copyright">
            <p>© 2024 Mahsua Games. Play instantly, no downloads required!</p>
        </div>
    </footer>

    <script>
document.addEventListener('DOMContentLoaded', () => {
    const coin = document.getElementById('coin');
    const flipButton = document.getElementById('flip-button');
    const statusMessage = document.getElementById('status-message');

    let lastResult = '';
    let consecutiveCount = 0;

    flipButton.addEventListener('click', () => {
        let result = '';

        if (consecutiveCount >= 2) {
            // Force a change after 2 consecutive results
            result = lastResult === 'heads' ? 'tails' : 'heads';
            consecutiveCount = 0;
        } else {
            result = Math.random() < 0.5 ? 'heads' : 'tails';
            if (result === lastResult) {
                consecutiveCount++;
            } else {
                consecutiveCount = 1;
            }
            lastResult = result;
        }

        const flipAnimationDuration = 3000;

        flipButton.disabled = true;
        statusMessage.textContent = "Flipping...";

        coin.style.transition = 'none';
        coin.style.transform = 'rotateY(0deg)';

        setTimeout(() => {
            coin.style.transition = `transform ${flipAnimationDuration / 1000}s cubic-bezier(0.68, -0.55, 0.27, 1.55)`;

            if (result === 'heads') {
                coin.style.transform = `rotateY(${360 * 10}deg)`;
            } else {
                coin.style.transform = `rotateY(${360 * 10 + 180}deg)`;
            }
        }, 50);

        setTimeout(() => {
            statusMessage.textContent = `It's ${result.toUpperCase()}!`;
            flipButton.disabled = false;
        }, flipAnimationDuration + 50);
    });
});

</script>
