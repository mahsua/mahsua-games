    <style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Orbitron', monospace;
    background: linear-gradient(135deg, #5a2dff 0%, #00ca98 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    transition: all 0.3s ease;
}

body.dark-theme {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
}

.dark-theme .dice-face {
    background: linear-gradient(145deg, #ff009f, #cc0077);
    border: 2px solid #990055;
    box-shadow: inset 0 0 10px rgba(255,255,255,0.1);
}

.dark-theme .results {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
}

.dark-theme .dice-count select {
    background: #2a2a3e;
    color: white;
    border: 2px solid #444;
}

.game-container {
    text-align: center;
    padding: 2rem;
    max-width: 800px;
    width: 100%;
}

.title {
    color: white;
    font-size: 1.5rem;
    font-weight: 900;
    margin-bottom: 1rem;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.subtitle {
    color: rgba(255,255,255,0.8);
    font-size: 1.2rem;
    margin-bottom: 3rem;
}

.dice-area {
    perspective: 1000px;
    margin: 3rem 0;
    min-height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 2rem;
    flex-wrap: wrap;
}

.dice {
    width: 80px;
    height: 80px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
}



.dice.rolling {
    animation: roll 1.5s cubic-bezier(0.4, 0.0, 0.2, 1);
}

.dice-face {
    position: absolute;
    width: 80px;
    height: 80px;
    background: linear-gradient(145deg, #ff009f, #e6008a);
    border: 2px solid #cc0077;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    font-weight: bold;
    color: #fff;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
}

.dice-face.front { transform: rotateY(0deg) translateZ(40px); }
.dice-face.back { transform: rotateY(180deg) translateZ(40px); }
.dice-face.right { transform: rotateY(90deg) translateZ(40px); }
.dice-face.left { transform: rotateY(-90deg) translateZ(40px); }
.dice-face.top { transform: rotateX(90deg) translateZ(40px); }
.dice-face.bottom { transform: rotateX(-90deg) translateZ(40px); }

.dot {
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    position: absolute;
}

.controls {
    display: flex;
    gap: 1rem;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin: 2rem 0;
}

.btn {
    background: linear-gradient(145deg, #4CAF50, #45a049);
    color: white;
    border: none;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    font-family: 'Orbitron', monospace;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

.btn:active {
    transform: translateY(0);
}

.btn.secondary {
    background: linear-gradient(145deg, #2196F3, #1976D2);
}

.dice-count {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: white;
    font-weight: bold;
}

.dice-count select {
    width: 100px;
    padding: 0.5rem;
    border: 2px solid #ddd;
    border-radius: 8px;
    text-align: center;
    font-size: 1rem;
    font-weight: bold;
    background: white;
    cursor: pointer;
}

.results {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 2rem;
    margin: 2rem 0;
    border: 1px solid rgba(255,255,255,0.2);
}

.result-item {
    color: white;
    font-size: 1.2rem;
    margin: 0.5rem 0;
}

.total {
    font-size: 2rem;
    font-weight: 900;
    color: #FFD700;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

footer {
    background-color: white;
    text-align: center;
    margin-top: auto;
    width: 100%;
    box-sizing: border-box;
    position: fixed;
    bottom: 0;
    left: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
}

.footer-links {
    color: #555;
    font-size: 0.8em;
    margin-bottom: 10px;
    display: flex;
    gap: 20px;
}

.footer-links a {
    color: #555;
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s ease;
}

.footer-links a:hover {
    color: var(--accent-color);
}

.footer-copyright {
    color: #777;
    font-size: 0.7em;
}

@keyframes roll {
    0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
    25% { transform: rotateX(180deg) rotateY(180deg) rotateZ(90deg); }
    50% { transform: rotateX(360deg) rotateY(360deg) rotateZ(180deg); }
    75% { transform: rotateX(540deg) rotateY(540deg) rotateZ(270deg); }
    100% { transform: rotateX(720deg) rotateY(720deg) rotateZ(360deg); }
}

@media (max-width: 768px) {
    .title { font-size: 2rem; }
    .dice { width: 60px; height: 60px; }
    .dice-face { width: 60px; height: 60px; font-size: 1.5rem; }
    .dice-face.front, .dice-face.back, .dice-face.right, 
    .dice-face.left, .dice-face.top, .dice-face.bottom { 
        transform-origin: center;
    }
    .dice-face.front { transform: rotateY(0deg) translateZ(30px); }
    .dice-face.back { transform: rotateY(180deg) translateZ(30px); }
    .dice-face.right { transform: rotateY(90deg) translateZ(30px); }
    .dice-face.left { transform: rotateY(-90deg) translateZ(30px); }
    .dice-face.top { transform: rotateX(90deg) translateZ(30px); }
    .dice-face.bottom { transform: rotateX(-90deg) translateZ(30px); }
}
</style>

<body>
    <div class="game-container">
        <h1 class="title">🎲 Virtual 3D Dice Flipper</h1>
        <p class="subtitle">Roll the dice and test your luck!</p>
        
        <div class="controls">
            <div class="dice-count">
                <label>Dice Count:</label>
                <select id="diceCount">
                    <option value="1">1 Die</option>
                    <option value="2" selected>2 Dice</option>
                    <option value="3">3 Dice</option>
                    <option value="4">4 Dice</option>
                    <option value="5">5 Dice</option>
                    <option value="6">6 Dice</option>
                </select>
            </div>
            <button class="btn theme-toggle" onclick="toggleTheme()">🌙 Dark</button>
        </div>
        
        <div class="dice-area" id="diceArea">
            <!-- Dice will be generated here -->
        </div>

        <div class="controls">
            <button class="btn" onclick="rollDice()">🎲 Roll Dice</button>
            <button class="btn secondary" onclick="resetGame()">🔄 Reset</button>
        </div>

        <div class="results" id="results" style="display: none;">
            <div class="result-item">Individual Results: <span id="individualResults"></span></div>
            <div class="result-item total">Total: <span id="totalResult">0</span></div>
            <div class="result-item">Average: <span id="averageResult">0</span></div>
        </div>
    </div>
    <footer>
        <div class="footer-links">
            <a href="./index.html">Games</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
        <div class="footer-copyright">
            <p>© 2024 Mahsua Games. Play instantly, no downloads required!</p>
        </div>

    <script>
let diceResults = [];
let isRolling = false;
let diceAudio = null;

// Initialize audio with your local sound file
function initializeAudio() {
    diceAudio = new Audio();
    // REPLACE THIS PATH with your actual sound file path:
    // Examples:
    // diceAudio.src = './sounds/dice-roll.wav';
    // diceAudio.src = 'assets/dice-flipper/dice-sound.mp3';
    // diceAudio.src = 'C:/Users/YourName/Desktop/assets/dice-flipper/dice-sound.mp3';
    diceAudio.src = 'assets/dice-flipper/dice-sound.mp3'; // Put your sound file path here
    diceAudio.volume = 0.5; // Adjust volume (0.0 to 1.0)
    diceAudio.preload = 'auto';
}

// Play dice sound effect
function createDiceSound() {
    if (diceAudio) {
        // Reset audio to beginning and play
        diceAudio.currentTime = 0;
        diceAudio.play().catch(e => {
            console.log('Audio playback failed:', e);
            // Fallback to synthetic sound if file fails
            createSyntheticSound();
        });
    } else {
        // Fallback to synthetic sound if no audio file
        createSyntheticSound();
    }
}

// Fallback synthetic sound (original Web Audio API version)
function createSyntheticSound() {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        
        oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + 0.1);
        oscillator.frequency.exponentialRampToValueAtTime(150, audioContext.currentTime + 0.2);
        oscillator.frequency.exponentialRampToValueAtTime(80, audioContext.currentTime + 0.3);
        
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
        
        oscillator.type = 'square';
        oscillator.start();
        oscillator.stop(audioContext.currentTime + 0.4);
    } catch (e) {
        console.log('Synthetic audio not supported');
    }
}

function createDiceFace(number) {
    const face = document.createElement('div');
    face.className = 'dice-face';
    
    // Create dot patterns for each number
    const dotPatterns = {
        1: [[50, 50]],
        2: [[25, 25], [75, 75]],
        3: [[25, 25], [50, 50], [75, 75]],
        4: [[25, 25], [75, 25], [25, 75], [75, 75]],
        5: [[25, 25], [75, 25], [50, 50], [25, 75], [75, 75]],
        6: [[25, 25], [75, 25], [25, 50], [75, 50], [25, 75], [75, 75]]
    };
    
    const pattern = dotPatterns[number];
    pattern.forEach(([x, y]) => {
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.style.left = `${x}%`;
        dot.style.top = `${y}%`;
        dot.style.transform = 'translate(-50%, -50%)';
        face.appendChild(dot);
    });
    
    return face;
}

function createDice() {
    const dice = document.createElement('div');
    dice.className = 'dice';
    
    const faces = ['front', 'back', 'right', 'left', 'top', 'bottom'];
    faces.forEach((faceClass, faceIndex) => {
        const face = createDiceFace(faceIndex + 1);
        face.classList.add(faceClass);
        dice.appendChild(face);
    });
    
    return dice;
}

function generateDice() {
    const diceArea = document.getElementById('diceArea');
    const diceCount = parseInt(document.getElementById('diceCount').value);
    
    diceArea.innerHTML = '';
    
    for (let i = 0; i < diceCount; i++) {
        const dice = createDice();
        diceArea.appendChild(dice);
    }
}



function rollDice() {
    if (isRolling) return;
    
    isRolling = true;
    const diceElements = document.querySelectorAll('.dice');
    const diceCount = diceElements.length;
    
    if (diceCount === 0) {
        generateDice();
        setTimeout(rollDice, 100);
        return;
    }
    
    // Generate results first
    diceResults = [];
    for (let i = 0; i < diceCount; i++) {
        diceResults.push(Math.floor(Math.random() * 6) + 1);
    }
    
    // Play sound effect
    try {
        createDiceSound();
    } catch (e) {
        console.log('Audio not supported');
    }
    
    // Add rolling animation
    diceElements.forEach(dice => {
        dice.classList.add('rolling');
    });
    
    // Apply final rotations after animation
    setTimeout(() => {
        diceElements.forEach((dice, index) => {
            const result = diceResults[index];
            
            // Remove rolling animation
            dice.classList.remove('rolling');
            
            // Set final rotation to show the correct face
            const rotations = {
                1: 'rotateX(0deg) rotateY(0deg)',      // front
                2: 'rotateX(0deg) rotateY(180deg)',    // back
                3: 'rotateX(0deg) rotateY(-90deg)',    // left
                4: 'rotateX(0deg) rotateY(90deg)',     // right
                5: 'rotateX(-90deg) rotateY(0deg)',    // top
                6: 'rotateX(90deg) rotateY(0deg)'      // bottom
            };
            
            dice.style.transform = rotations[result];
        });
        
        // Show results after animation
        setTimeout(() => {
            showResults();
            isRolling = false;
        }, 300);
    }, 1500);
}

function showResults() {
    const resultsDiv = document.getElementById('results');
    const individualResults = document.getElementById('individualResults');
    const totalResult = document.getElementById('totalResult');
    const averageResult = document.getElementById('averageResult');
    
    const total = diceResults.reduce((sum, result) => sum + result, 0);
    const average = (total / diceResults.length).toFixed(1);
    
    individualResults.textContent = diceResults.join(', ');
    totalResult.textContent = total;
    averageResult.textContent = average;
    
    resultsDiv.style.display = 'block';
}

function resetGame() {
    if (isRolling) return;
    
    const resultsDiv = document.getElementById('results');
    resultsDiv.style.display = 'none';
    
    diceResults = [];
    generateDice();
}

// Initialize the game
document.getElementById('diceCount').addEventListener('change', function() {
    if (!isRolling) {
        generateDice();
    }
});

// Theme toggle functionality
function toggleTheme() {
    const body = document.body;
    const themeButton = document.querySelector('.theme-toggle');
    
    body.classList.toggle('dark-theme');
    
    if (body.classList.contains('dark-theme')) {
        themeButton.innerHTML = '☀️ Light';
        localStorage.setItem('theme', 'dark');
    } else {
        themeButton.innerHTML = '🌙 Dark';
        localStorage.setItem('theme', 'light');
    }
}

// Load saved theme on page load
function loadTheme() {
    const savedTheme = localStorage.getItem('theme');
    const themeButton = document.querySelector('.theme-toggle');
    
    if (savedTheme === 'dark') {
        document.body.classList.add('dark-theme');
        themeButton.innerHTML = '☀️ Light';
    }
}

// Generate initial dice
generateDice();

// Load theme after page loads
loadTheme();

// Initialize audio after page loads
initializeAudio();
</script>

  <button type="button" id="mahsuaFsBtn" class="mahsua-nav-btn mahsua-fs-btn" title="Toggle Full Screen">⛶ Full Screen</button>
</div>
<script>
  (function() {
    var fsBtn = document.getElementById('mahsuaFsBtn');
    if (!fsBtn) return;
    function isFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function updateFsLabel() {
      fsBtn.textContent = isFull() ? '✕ Exit Full' : '⛶ Full Screen';
    }
    fsBtn.addEventListener('click', function() {
      var el = document.documentElement;
      if (!isFull()) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', updateFsLabel);
    document.addEventListener('webkitfullscreenchange', updateFsLabel);
  })();
</script>
