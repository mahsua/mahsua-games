    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #ffe6f0 0%, #e0f3ff 50%, #e6ffe6 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(236, 72, 153, 0.2);
            --text-color: #1e293b;
            --text-secondary: #64748b;
            --canvas-bg: #f8fafc;
            --accent-pink: #ec4899;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        body.dark {
            --bg-gradient: linear-gradient(135deg, #1f1024 0%, #0f172a 50%, #0b221a 100%);
            --card-bg: rgba(30, 41, 59, 0.92);
            --card-border: rgba(236, 72, 153, 0.3);
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --canvas-bg: #0f172a;
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 660px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.85rem;
            gap: 0.5rem;
        }

        .back-link {
            text-decoration: none;
            color: var(--accent-blue);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .top-actions {
            display: flex;
            gap: 0.45rem;
        }

        .pill-btn {
            background: rgba(59, 130, 246, 0.12);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: flex;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.12), rgba(59, 130, 246, 0.12));
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.35rem 0.65rem;
            text-align: center;
            min-width: 64px;
        }

        .stat-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .stat-value {
            font-size: 1.05rem;
            font-weight: 800;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.85rem;
        }

        .subtitle {
            font-size: 0.84rem;
            color: var(--text-secondary);
        }

        .btn-group {
            display: flex;
            gap: 0.45rem;
        }

        .btn {
            border: none;
            border-radius: 12px;
            padding: 0.48rem 0.85rem;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue));
            color: #fff;
        }

        .btn-secondary {
            background: rgba(16, 185, 129, 0.15);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        body.dark .btn-secondary {
            color: #34d399;
        }

        .canvas-wrap {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--card-border);
            background: var(--canvas-bg);
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: crosshair;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.74);
            backdrop-filter: blur(4px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: #fff;
            text-align: center;
            padding: 1.5rem;
        }

        .overlay.active {
            display: flex;
        }

        .overlay h2 {
            font-size: 1.75rem;
            font-weight: 800;
        }

        .hint {
            margin-top: 0.8rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="./index.html" class="back-link">← All Games</a>
            <div class="top-actions">
                <button class="pill-btn" id="soundToggle" type="button">🔊 Sound</button>
                <button class="pill-btn" id="themeToggle" type="button">🌙 Dark</button>
            </div>
        </div>

        <div class="header">
            <h1>🍉 Fruit Ninja</h1>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Best</div>
                    <div class="stat-value" id="bestScore">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Lives</div>
                    <div class="stat-value" id="lives">❤️❤️❤️</div>
                </div>
            </div>
        </div>

        <div class="controls-row">
            <span class="subtitle">Slice flying fruits — avoid 💣 bombs!</span>
            <div class="btn-group">
                <button class="btn btn-secondary" id="pauseBtn" type="button">Pause</button>
                <button class="btn btn-primary" id="restartBtn" type="button">New Game</button>
            </div>
        </div>

        <div class="canvas-wrap">
            <canvas id="fruitCanvas" width="600" height="420"></canvas>
            <div class="overlay active" id="overlay">
                <h2 id="overlayTitle">Fruit Ninja</h2>
                <p id="overlayMsg">Swipe or drag across fruits to slice them!</p>
                <button class="btn btn-primary" id="startBtn" type="button">Start Slicing</button>
            </div>
        </div>

        <p class="hint">Drag with your finger (mobile) or click &amp; drag with your mouse (desktop) to slice.</p>
    </div>

    <script>
        const canvas = document.getElementById('fruitCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('bestScore');
        const livesEl = document.getElementById('lives');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const startBtn = document.getElementById('startBtn');
        const soundToggle = document.getElementById('soundToggle');
        const themeToggle = document.getElementById('themeToggle');

        const FRUITS = [
            { emoji: '🍉', color: '#10b981' },
            { emoji: '🍎', color: '#ec4899' },
            { emoji: '🍊', color: '#f59e0b' },
            { emoji: '🍇', color: '#8b5cf6' },
            { emoji: '🍓', color: '#f43f5e' },
            { emoji: '🍍', color: '#eab308' },
        ];

        let score = 0;
        let bestScore = parseInt(localStorage.getItem('mahsua_fruit_best') || '0', 10);
        let lives = 3;
        let running = false;
        let paused = false;
        let soundOn = true;
        let items = [];
        let particles = [];
        let popups = [];
        let trail = [];
        let isSlicing = false;
        let spawnTimer = 0;
        let comboCount = 0;
        let comboTimer = 0;

        bestScoreEl.textContent = bestScore;

        let audioCtx = null;
        function beep(freq, dur = 0.06, type = 'sine') {
            if (!soundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch (_) {}
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
        });

        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
        });

        function updateHUD() {
            scoreEl.textContent = score;
            livesEl.textContent = '❤️'.repeat(Math.max(0, lives)) || '💔';
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('mahsua_fruit_best', String(bestScore));
                bestScoreEl.textContent = bestScore;
            }
        }

        function startGame() {
            score = 0;
            lives = 3;
            items = [];
            particles = [];
            popups = [];
            trail = [];
            spawnTimer = 20;
            comboCount = 0;
            comboTimer = 0;
            running = true;
            paused = false;
            pauseBtn.textContent = 'Pause';
            updateHUD();
            overlay.classList.remove('active');
        }

        pauseBtn.addEventListener('click', () => {
            if (!running) return;
            paused = !paused;
            pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        });

        restartBtn.addEventListener('click', startGame);
        startBtn.addEventListener('click', startGame);

        function spawnWave() {
            const count = 1 + Math.floor(Math.random() * 3);
            for (let i = 0; i < count; i++) {
                const isBomb = Math.random() < 0.16;
                const fruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
                const x = 70 + Math.random() * (canvas.width - 140);
                const vx = (canvas.width / 2 - x) * 0.012 + (Math.random() * 2.4 - 1.2);
                const vy = -(8.8 + Math.random() * 2.6);
                items.push({
                    x,
                    y: canvas.height + 24,
                    vx,
                    vy,
                    r: 26,
                    isBomb,
                    emoji: isBomb ? '💣' : fruit.emoji,
                    color: isBomb ? '#ef4444' : fruit.color,
                    sliced: false,
                    rot: 0,
                    vrot: Math.random() * 0.12 - 0.06
                });
            }
        }

        function addSplash(x, y, color) {
            for (let i = 0; i < 12; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 1.5 + Math.random() * 4;
                particles.push({
                    x, y,
                    vx: Math.cos(a) * s,
                    vy: Math.sin(a) * s,
                    r: 3 + Math.random() * 4,
                    color,
                    life: 24
                });
            }
        }

        function getPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function handleSlicePoint(pt) {
            if (!running || paused) return;
            trail.push({ x: pt.x, y: pt.y, life: 10 });
            if (trail.length > 16) trail.shift();

            for (const it of items) {
                if (it.sliced) continue;
                const dist = Math.hypot(pt.x - it.x, pt.y - it.y);
                if (dist <= it.r + 8) {
                    it.sliced = true;
                    if (it.isBomb) {
                        beep(150, 0.25, 'sawtooth');
                        addSplash(it.x, it.y, '#ef4444');
                        running = false;
                        overlayTitle.textContent = '💥 Boom!';
                        overlayMsg.textContent = 'You sliced a bomb! Final Score: ' + score;
                        startBtn.textContent = 'Play Again';
                        overlay.classList.add('active');
                        return;
                    } else {
                        score += 10;
                        comboCount++;
                        comboTimer = 14;
                        if (comboCount >= 3) {
                            score += 10;
                            popups.push({ x: it.x, y: it.y - 16, text: 'COMBO +10!', life: 30 });
                            beep(820, 0.08);
                        } else {
                            beep(620, 0.05);
                        }
                        addSplash(it.x, it.y, it.color);
                        updateHUD();
                    }
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isSlicing = true;
            handleSlicePoint(getPos(e.clientX, e.clientY));
        });
        canvas.addEventListener('mousemove', (e) => {
            if (isSlicing) handleSlicePoint(getPos(e.clientX, e.clientY));
        });
        window.addEventListener('mouseup', () => { isSlicing = false; trail = []; });

        canvas.addEventListener('touchstart', (e) => {
            isSlicing = true;
            if (e.touches[0]) handleSlicePoint(getPos(e.touches[0].clientX, e.touches[0].clientY));
        }, { passive: true });
        canvas.addEventListener('touchmove', (e) => {
            if (isSlicing && e.touches[0]) handleSlicePoint(getPos(e.touches[0].clientX, e.touches[0].clientY));
        }, { passive: true });
        window.addEventListener('touchend', () => { isSlicing = false; trail = []; });

        function update() {
            if (!running || paused) return;

            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer === 0) comboCount = 0;
            }

            spawnTimer--;
            if (spawnTimer <= 0) {
                spawnWave();
                spawnTimer = 55 + Math.floor(Math.random() * 35);
            }

            for (const it of items) {
                it.x += it.vx;
                it.y += it.vy;
                it.vy += 0.22; // gravity
                it.rot += it.vrot;

                if (!it.sliced && !it.isBomb && it.vy > 0 && it.y > canvas.height + 40) {
                    it.sliced = true;
                    lives--;
                    updateHUD();
                    beep(220, 0.12);
                    if (lives <= 0) {
                        running = false;
                        overlayTitle.textContent = 'Game Over!';
                        overlayMsg.textContent = 'Final Score: ' + score;
                        startBtn.textContent = 'Play Again';
                        overlay.classList.add('active');
                        return;
                    }
                }
            }
            items = items.filter(it => !it.sliced && it.y < canvas.height + 60);

            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12;
                p.life--;
            }
            particles = particles.filter(p => p.life > 0);

            for (const pop of popups) {
                pop.y -= 1;
                pop.life--;
            }
            popups = popups.filter(pop => pop.life > 0);

            for (const t of trail) t.life--;
            trail = trail.filter(t => t.life > 0);
        }

        function draw() {
            const isDark = document.body.classList.contains('dark');
            ctx.fillStyle = isDark ? '#0f172a' : '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Particles
            for (const p of particles) {
                ctx.globalAlpha = p.life / 24;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Fruits & bombs
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '38px sans-serif';
            for (const it of items) {
                ctx.save();
                ctx.translate(it.x, it.y);
                ctx.rotate(it.rot);
                ctx.fillText(it.emoji, 0, 0);
                ctx.restore();
            }

            // Blade trail
            if (trail.length > 1) {
                ctx.strokeStyle = '#ec4899';
                ctx.lineCap = 'round';
                for (let i = 1; i < trail.length; i++) {
                    ctx.lineWidth = (i / trail.length) * 8;
                    ctx.beginPath();
                    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
                    ctx.lineTo(trail[i].x, trail[i].y);
                    ctx.stroke();
                }
            }

            // Combo popups
            ctx.font = '800 16px Outfit, sans-serif';
            ctx.fillStyle = '#10b981';
            for (const pop of popups) {
                ctx.globalAlpha = pop.life / 30;
                ctx.fillText(pop.text, pop.x, pop.y);
            }
            ctx.globalAlpha = 1;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

<style>
  #mahsua-nav-bar {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 99999;

  body.dark #mahsua-nav-bar,

  }
  .mahsua-nav-btn:active {
    transform: scale(0.95);
  }
  .mahsua-home-btn {
    background: linear-gradient(135deg, #ec4899, #3b82f6);
    color: #ffffff;
  }
  .mahsua-fs-btn {
    background: linear-gradient(135deg, #10b981, #3b82f6);
    color: #ffffff;
  }
</style>
<div id="mahsua-nav-bar">
  <a href="https://games.mahsua.com/" class="mahsua-nav-btn mahsua-home-btn" title="Go to Mahsua Games Home">🏠 Home</a>
  <button type="button" id="mahsuaFsBtn" class="mahsua-nav-btn mahsua-fs-btn" title="Toggle Full Screen">⛶ Full Screen</button>
</div>
<script>
  (function() {
    var fsBtn = document.getElementById('mahsuaFsBtn');
    if (!fsBtn) return;
    function isFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function updateFsLabel() {
      fsBtn.textContent = isFull() ? '✕ Exit Full' : '⛶ Full Screen';
    }
    fsBtn.addEventListener('click', function() {
      var el = document.documentElement;
      if (!isFull()) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', updateFsLabel);
    document.addEventListener('webkitfullscreenchange', updateFsLabel);
  })();
</script>
