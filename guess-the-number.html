<body>
    <div class="container">
        <h1>Guess the Number!</h1>
        <p>I have picked a number between 1 and 100. Can you guess it?</p>

        <div class="game-area">
            <input type="number" id="guess-input" placeholder="Enter your guess...">
            <button class="button" id="guess-button">Guess</button>
        </div>

        <div class="results">
            <p id="message" class="message"></p>
            <p id="guess-count" class="guess-count"></p>
        </div>

        <button class="button" id="restart-button" style="display: none;">Play Again</button>
    </div>

    <footer>

    <script>
document.addEventListener('DOMContentLoaded', () => {
    const guessInput = document.getElementById('guess-input');
    const guessButton = document.getElementById('guess-button');
    const restartButton = document.getElementById('restart-button');
    const message = document.getElementById('message');
    const guessCountDisplay = document.getElementById('guess-count');

    let randomNumber;
    let guesses = 0;

    const startNewGame = () => {
        randomNumber = Math.floor(Math.random() * 100) + 1;
        guesses = 0;
        message.textContent = '';
        guessCountDisplay.textContent = '';
        guessInput.value = '';
        guessInput.disabled = false;
        guessButton.disabled = false;
        restartButton.style.display = 'none';
        guessInput.focus();
    };

    const checkGuess = () => {
        const userGuess = parseInt(guessInput.value);

        if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
            message.textContent = 'Please enter a valid number between 1 and 100.';
            message.style.color = '#e74c3c';
            return;
        }

        guesses++;

        if (userGuess === randomNumber) {
            message.textContent = `Congratulations! You guessed the number in ${guesses} attempts!`;
            message.style.color = '#2ecc71';
            guessInput.disabled = true;
            guessButton.disabled = true;
            restartButton.style.display = 'block';
        } else if (userGuess < randomNumber) {
            message.textContent = 'Too low! Try again.';
            message.style.color = '#3498db';
        } else {
            message.textContent = 'Too high! Try again.';
            message.style.color = '#e67e22';
        }

        guessCountDisplay.textContent = `Guesses: ${guesses}`;
    };

    guessButton.addEventListener('click', checkGuess);
    restartButton.addEventListener('click', startNewGame);

    guessInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            checkGuess();
        }
    });

    startNewGame();
});

</script>

<button type="button" id="mahsua-exit-fs">✕ Exit Fullscreen</button>
<script>
  (function() {
    var fsBtns = document.querySelectorAll('.mahsua-fs-inline, #mahsuaFsBtn');
    var exitBtn = document.getElementById('mahsua-exit-fs');
    function isNativeFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function enterFull() {
      document.body.classList.add('mahsua-fullscreen');
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }
    function exitFull() {
      document.body.classList.remove('mahsua-fullscreen');
      if (isNativeFull()) {
        if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
    fsBtns.forEach(function(b) {
      b.addEventListener('click', function() {
        if (document.body.classList.contains('mahsua-fullscreen') || isNativeFull()) exitFull();
        else enterFull();
      });
    });
    if (exitBtn) exitBtn.addEventListener('click', exitFull);
    function onNativeChange() {
      if (!isNativeFull()) document.body.classList.remove('mahsua-fullscreen');
    }
    document.addEventListener('fullscreenchange', onNativeChange);
    document.addEventListener('webkitfullscreenchange', onNativeChange);
  })();
</script>
