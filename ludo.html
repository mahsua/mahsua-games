<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Ads -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9351361840615541" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-9351361840615541">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LudoJS Tutorial</title>
    <link rel="stylesheet" href="./assets/ludo/style.css">
</head>
<body>
    <div class="ludo-container">
        <div class="ludo">
            <div class="player-pieces">
                <div class="player-piece" player-id="P1" piece="0"></div>
                <div class="player-piece" player-id="P1" piece="1"></div>
                <div class="player-piece" player-id="P1" piece="2"></div>
                <div class="player-piece" player-id="P1" piece="3"></div>
                
                <div class="player-piece" player-id="P2" piece="0"></div>
                <div class="player-piece" player-id="P2" piece="1"></div>
                <div class="player-piece" player-id="P2" piece="2"></div>
                <div class="player-piece" player-id="P2" piece="3"></div>
            </div>

            <div class="player-bases">
                <div class="player-base" player-id="P1"></div>
                <div class="player-base" player-id="P2"></div>
            </div>
        </div>
        <div class="footer">
            <div class="row">
                <button id="dice-btn" class="btn btn-dice">Roll</button>
                <div class="dice-value"></div>
                <button id="reset-btn" class="btn btn-reset">Reset</button>
            </div>
            <h2 class="active-player">Active Player: <span></span> </h2>
        </div>
    </div>

    <script src="./assets/ludo/./assets/ludo/main.js" type="module"></script>

<!-- Mahsua Floating Home & Fullscreen Bar -->
<style>
  #mahsua-nav-bar {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(236, 72, 153, 0.3);
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16);
    backdrop-filter: blur(12px);
    font-family: 'Outfit', system-ui, sans-serif;
  }
  body.dark #mahsua-nav-bar, body.dark-mode #mahsua-nav-bar {
    background: rgba(15, 23, 42, 0.9);
  }
  .mahsua-nav-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 11px; border-radius: 999px; border: none;
    font-family: inherit; font-size: 12px; font-weight: 700;
    text-decoration: none; cursor: pointer;
  }
  .mahsua-home-btn { background: linear-gradient(135deg, #ec4899, #3b82f6); color: #fff; }
  .mahsua-fs-btn { background: rgba(16, 185, 129, 0.16); color: #059669; border: 1px solid rgba(16, 185, 129, 0.35); }
  body.mahsua-fullscreen #mahsua-nav-bar { display: none !important; }
</style>
<div id="mahsua-nav-bar">
  <a href="https://games.mahsua.com/" class="mahsua-home-btn mahsua-nav-btn" title="Go to Mahsua Games Home">🏠 Home</a>
  <button type="button" id="mahsuaFsBtn" class="mahsua-nav-btn mahsua-fs-btn" title="Fullscreen">⛶ Fullscreen</button>
</div>
<!-- Mahsua Fullscreen Stage Styles & Exit Button -->
<style>
  .mahsua-fs-inline {
    background: rgba(16, 185, 129, 0.14) !important;
    color: #059669 !important;
    border: 1px solid rgba(16, 185, 129, 0.35) !important;
    border-radius: 999px;
    padding: 0.35rem 0.75rem;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
  body.dark .mahsua-fs-inline {
    color: #34d399 !important;
  }
  #mahsua-exit-fs {
    display: none;
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 99999;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(16, 185, 129, 0.4);
    background: rgba(15, 23, 42, 0.85);
    color: #fff;
    font-family: 'Outfit', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  body.mahsua-fullscreen #mahsua-exit-fs {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  body.mahsua-fullscreen {
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden !important;
  }
  body.mahsua-fullscreen > header,
  body.mahsua-fullscreen > footer,
  body.mahsua-fullscreen .top-bar,
  body.mahsua-fullscreen .hint,
  body.mahsua-fullscreen .back-link {
    display: none !important;
  }
  body.mahsua-fullscreen .container,
  body.mahsua-fullscreen .game-container,
  body.mahsua-fullscreen .game-wrapper,
  body.mahsua-fullscreen .ludo-container,
  body.mahsua-fullscreen > main,
  body.mahsua-fullscreen > .bg-card {
    position: fixed !important;
    inset: 0 !important;
    width: 100vw !important;
    height: 100dvh !important;
    max-width: 100vw !important;
    max-height: 100dvh !important;
    margin: 0 !important;
    border-radius: 0 !important;
    border: none !important;
    padding: 56px 12px 16px !important;
    z-index: 9998 !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    overflow-y: auto !important;
  }
  body.mahsua-fullscreen .canvas-wrap {
    flex: 1 1 auto !important;
    min-height: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  body.mahsua-fullscreen canvas {
    max-height: calc(100dvh - 195px) !important;
    width: auto !important;
    max-width: 100% !important;
    margin: 0 auto !important;
    object-fit: contain !important;
  }
  @media (max-height: 540px) and (orientation: landscape) {
    body { padding: 0.35rem !important; }
    .container, .game-container { padding: 0.6rem 0.9rem !important; }
    .top-bar, .hint { display: none !important; }
    .header { margin-bottom: 0.35rem !important; }
    .header h1 { font-size: 1.25rem !important; }
    .controls-row { margin-bottom: 0.35rem !important; }
    canvas { max-height: calc(100dvh - 125px) !important; width: auto !important; max-width: 100% !important; margin: 0 auto !important; }
  }
</style>
<button type="button" id="mahsua-exit-fs">✕ Exit Fullscreen</button>
<script>
  (function() {
    var fsBtns = document.querySelectorAll('.mahsua-fs-inline, #mahsuaFsBtn');
    var exitBtn = document.getElementById('mahsua-exit-fs');
    function isNativeFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function enterFull() {
      document.body.classList.add('mahsua-fullscreen');
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }
    function exitFull() {
      document.body.classList.remove('mahsua-fullscreen');
      if (isNativeFull()) {
        if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
    fsBtns.forEach(function(b) {
      b.addEventListener('click', function() {
        if (document.body.classList.contains('mahsua-fullscreen') || isNativeFull()) exitFull();
        else enterFull();
      });
    });
    if (exitBtn) exitBtn.addEventListener('click', exitFull);
    function onNativeChange() {
      if (!isNativeFull()) document.body.classList.remove('mahsua-fullscreen');
    }
    document.addEventListener('fullscreenchange', onNativeChange);
    document.addEventListener('webkitfullscreenchange', onNativeChange);
  })();
</script>
</body>
</html>
