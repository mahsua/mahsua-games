    <div class="container">
        <div class="top-bar">
            <a href="https://games.mahsua.com/" class="back-link">🏠 Home</a>

                <button class="pill-btn" id="soundToggle" type="button">🔊 Sound</button>
                <button class="pill-btn" id="themeToggle" type="button">🌙 Dark</button>
            </div>
        </div>

        <div class="header">
            <h1>🏓 Pong Classic</h1>
            <div class="scoreboard">
                <span class="score-you">You: <span id="playerScore">0</span></span>
                <span>•</span>
                <span class="score-ai">AI: <span id="aiScore">0</span></span>
            </div>
        </div>

        <div class="controls-row">
            <label>
                Difficulty:
                <select id="difficulty">
                    <option value="easy">Easy</option>

                    <option value="hard">Hard</option>
                </select>
            </label>
            <div class="btn-group">

        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="pongCanvas" width="640" height="400"></canvas>
            <div class="overlay active" id="overlay">
                <h2 id="overlayTitle">Ready to Play?</h2>
                <p id="overlayMsg">First to 7 points wins!</p>
                <button class="btn btn-primary" id="startBtn" type="button">Start Match</button>
            </div>
        </div>

        <div class="touch-controls">
            <button class="touch-btn" id="upBtn" type="button">▲ Up</button>
            <button class="touch-btn" id="downBtn" type="button">▼ Down</button>
        </div>

        <p class="hint">Move your paddle with Arrow keys / W-S, mouse, or by dragging on the board.</p>
    </div>

    <script>
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');
        const difficultyEl = document.getElementById('difficulty');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const startBtn = document.getElementById('startBtn');
        const soundToggle = document.getElementById('soundToggle');
        const themeToggle = document.getElementById('themeToggle');
        const upBtn = document.getElementById('upBtn');
        const downBtn = document.getElementById('downBtn');

        const WIN_SCORE = 7;
        const PADDLE_W = 12;
        const PADDLE_H = 84;
        const BALL_R = 9;

        let soundOn = true;
        let running = false;
        let paused = false;
        let playerScore = 0;
        let aiScore = 0;

        const player = { x: 16, y: canvas.height / 2 - PADDLE_H / 2, dy: 0 };
        const ai = { x: canvas.width - 16 - PADDLE_W, y: canvas.height / 2 - PADDLE_H / 2 };
        const ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 5, vy: 3 };

        const keys = { up: false, down: false };

        let audioCtx = null;
        function beep(freq, dur = 0.06) {
            if (!soundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch (_) {}
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
        });

        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
        });

        function resetBall(dir = 1) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            const speed = 5.2;
            const angle = (Math.random() * 0.7 - 0.35);
            ball.vx = dir * speed * Math.cos(angle);
            ball.vy = speed * Math.sin(angle);
        }

        function startMatch() {
            playerScore = 0;
            aiScore = 0;
            playerScoreEl.textContent = '0';
            aiScoreEl.textContent = '0';
            player.y = canvas.height / 2 - PADDLE_H / 2;
            ai.y = canvas.height / 2 - PADDLE_H / 2;
            resetBall(Math.random() < 0.5 ? 1 : -1);
            running = true;
            paused = false;
            pauseBtn.textContent = 'Pause';
            overlay.classList.remove('active');
        }

        pauseBtn.addEventListener('click', () => {
            if (!running) return;
            paused = !paused;
            pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        });

        restartBtn.addEventListener('click', startMatch);
        startBtn.addEventListener('click', startMatch);

        function movePaddleTo(clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleY = canvas.height / rect.height;
            const y = (clientY - rect.top) * scaleY - PADDLE_H / 2;
            player.y = Math.max(0, Math.min(canvas.height - PADDLE_H, y));
        }

        canvas.addEventListener('mousemove', (e) => {
            if (running && !paused) movePaddleTo(e.clientY);
        });

        canvas.addEventListener('touchmove', (e) => {
            if (running && !paused && e.touches[0]) {
                movePaddleTo(e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); keys.up = true; }
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); keys.down = true; }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
        });

        upBtn.addEventListener('touchstart', () => keys.up = true, { passive: true });
        upBtn.addEventListener('touchend', () => keys.up = false, { passive: true });
        downBtn.addEventListener('touchstart', () => keys.down = true, { passive: true });
        downBtn.addEventListener('touchend', () => keys.down = false, { passive: true });
        upBtn.addEventListener('mousedown', () => keys.up = true);
        upBtn.addEventListener('mouseup', () => keys.up = false);
        downBtn.addEventListener('mousedown', () => keys.down = true);
        downBtn.addEventListener('mouseup', () => keys.down = false);

        function update() {
            if (!running || paused) return;

            const paddleSpeed = 6.5;
            if (keys.up) player.y -= paddleSpeed;
            if (keys.down) player.y += paddleSpeed;
            player.y = Math.max(0, Math.min(canvas.height - PADDLE_H, player.y));

            const aiSpeeds = { easy: 3.2, medium: 4.7, hard: 6.2 };
            const aiSpeed = aiSpeeds[difficultyEl.value];
            const aiCenter = ai.y + PADDLE_H / 2;
            if (aiCenter < ball.y - 10) ai.y += aiSpeed;
            else if (aiCenter > ball.y + 10) ai.y -= aiSpeed;
            ai.y = Math.max(0, Math.min(canvas.height - PADDLE_H, ai.y));

            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.y - BALL_R < 0) {
                ball.y = BALL_R;
                ball.vy *= -1;
                beep(340);
            } else if (ball.y + BALL_R > canvas.height) {
                ball.y = canvas.height - BALL_R;
                ball.vy *= -1;
                beep(340);
            }

            // Player paddle hit
            if (ball.vx < 0 &&
                ball.x - BALL_R <= player.x + PADDLE_W &&
                ball.x + BALL_R >= player.x &&
                ball.y + BALL_R >= player.y &&
                ball.y - BALL_R <= player.y + PADDLE_H) {
                const hitPos = (ball.y - (player.y + PADDLE_H / 2)) / (PADDLE_H / 2);
                const speed = Math.min(10.5, Math.hypot(ball.vx, ball.vy) * 1.05);
                const angle = hitPos * (Math.PI / 3);
                ball.vx = speed * Math.cos(angle);
                ball.vy = speed * Math.sin(angle);
                ball.x = player.x + PADDLE_W + BALL_R;
                beep(520);
            }

            // AI paddle hit
            if (ball.vx > 0 &&
                ball.x + BALL_R >= ai.x &&
                ball.x - BALL_R <= ai.x + PADDLE_W &&
                ball.y + BALL_R >= ai.y &&
                ball.y - BALL_R <= ai.y + PADDLE_H) {
                const hitPos = (ball.y - (ai.y + PADDLE_H / 2)) / (PADDLE_H / 2);
                const speed = Math.min(10.5, Math.hypot(ball.vx, ball.vy) * 1.05);
                const angle = hitPos * (Math.PI / 3);
                ball.vx = -speed * Math.cos(angle);
                ball.vy = speed * Math.sin(angle);
                ball.x = ai.x - BALL_R;
                beep(460);
            }

            // Scoring
            if (ball.x + BALL_R < 0) {
                aiScore++;
                aiScoreEl.textContent = aiScore;
                beep(220, 0.14);
                checkWin() || resetBall(1);
            } else if (ball.x - BALL_R > canvas.width) {
                playerScore++;
                playerScoreEl.textContent = playerScore;
                beep(680, 0.12);
                checkWin() || resetBall(-1);
            }
        }

        function checkWin() {
            if (playerScore >= WIN_SCORE || aiScore >= WIN_SCORE) {
                running = false;
                overlayTitle.textContent = playerScore >= WIN_SCORE ? '🏆 You Win!' : '🤖 AI Wins!';
                overlayMsg.textContent = 'Final Score: ' + playerScore + ' - ' + aiScore;
                startBtn.textContent = 'Play Again';
                overlay.classList.add('active');
                return true;
            }
            return false;
        }

        function draw() {
            const isDark = document.body.classList.contains('dark');
            ctx.fillStyle = isDark ? '#0f172a' : '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center dashed line
            ctx.setLineDash([8, 8]);
            ctx.strokeStyle = isDark ? 'rgba(148,163,184,0.28)' : 'rgba(100,116,139,0.25)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Player paddle (pink)
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, PADDLE_W, PADDLE_H, 6);
            ctx.fill();

            // AI paddle (blue)
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.roundRect(ai.x, ai.y, PADDLE_W, PADDLE_H, 6);
            ctx.fill();

            // Ball (green)
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

  body.mahsua-fullscreen .canvas-wrap {
    flex: 1 1 auto !important;
    min-height: 0 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
  }
  body.mahsua-fullscreen canvas {
    max-height: calc(100dvh - 195px) !important;
    width: auto !important;
    max-width: 100% !important;
    margin: 0 auto !important;
    object-fit: contain !important;
  }
  @media (max-height: 540px) and (orientation: landscape) {
    body { padding: 0.35rem !important; }
    .container, .game-container { padding: 0.6rem 0.9rem !important; }
    .top-bar, .hint { display: none !important; }
    .header { margin-bottom: 0.35rem !important; }
    .header h1 { font-size: 1.25rem !important; }
    .controls-row { margin-bottom: 0.35rem !important; }
    canvas { max-height: calc(100dvh - 125px) !important; width: auto !important; max-width: 100% !important; margin: 0 auto !important; }
  }
</style>
<button type="button" id="mahsua-exit-fs">✕ Exit Fullscreen</button>
<script>
  (function() {
    var fsBtns = document.querySelectorAll('.mahsua-fs-inline, #mahsuaFsBtn');
    var exitBtn = document.getElementById('mahsua-exit-fs');
    function isNativeFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function enterFull() {
      document.body.classList.add('mahsua-fullscreen');
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }
    function exitFull() {
      document.body.classList.remove('mahsua-fullscreen');
      if (isNativeFull()) {
        if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
    fsBtns.forEach(function(b) {
      b.addEventListener('click', function() {
        if (document.body.classList.contains('mahsua-fullscreen') || isNativeFull()) exitFull();
        else enterFull();
      });
    });
    if (exitBtn) exitBtn.addEventListener('click', exitFull);
    function onNativeChange() {
      if (!isNativeFull()) document.body.classList.remove('mahsua-fullscreen');
    }
    document.addEventListener('fullscreenchange', onNativeChange);
    document.addEventListener('webkitfullscreenchange', onNativeChange);
  })();
</script>
</body>
</html>
