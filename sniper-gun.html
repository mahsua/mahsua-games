        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-gradient: linear-gradient(135deg, #ffe6f0 0%, #e0f3ff 50%, #e6ffe6 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(236, 72, 153, 0.2);

            --text-secondary: #64748b;
            --canvas-bg: #f8fafc;

            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }
        body.dark {
            --bg-gradient: linear-gradient(135deg, #1f1024 0%, #0f172a 50%, #0b221a 100%);
            --card-bg: rgba(30, 41, 59, 0.92);
            --card-border: rgba(236, 72, 153, 0.3);
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --canvas-bg: #0f172a;
            --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }
        body {

            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .container {
            width: 100%;
            max-width: 660px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
        .back-link { text-decoration: none; color: var(--accent-blue); font-weight: 600; font-size: 0.9rem; }
        .top-actions { display: flex; gap: 0.45rem; }
        .pill-btn {
            background: rgba(59, 130, 246, 0.12); color: var(--text-color);
            border: 1px solid var(--card-border); border-radius: 999px;
            padding: 0.35rem 0.75rem; font-family: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
        }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.65rem; margin-bottom: 0.85rem; }
        h1 {
            font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue), var(--accent-green));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .stats { display: flex; gap: 0.45rem; flex-wrap: wrap; }
        .stat-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.12), rgba(59, 130, 246, 0.12));
            border: 1px solid var(--card-border); border-radius: 12px;
            padding: 0.3rem 0.65rem; text-align: center; min-width: 62px;
        }
        .stat-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }
        .stat-value { font-size: 0.98rem; font-weight: 800; }
        .controls-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.85rem; }
        .btn {
            border: none; border-radius: 12px; padding: 0.48rem 0.85rem;
            font-family: inherit; font-size: 0.84rem; font-weight: 700; cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, var(--accent-pink), var(--accent-blue)); color: #fff; }
        .btn-secondary { background: rgba(16, 185, 129, 0.15); color: #059669; border: 1px solid rgba(16, 185, 129, 0.35); }
        body.dark .btn-secondary { color: #34d399; }
        .canvas-wrap {
            position: relative; width: 100%; border-radius: 16px; overflow: hidden;
            border: 2px solid var(--card-border); background: var(--canvas-bg); touch-action: none;
        }
        canvas { display: block; width: 100%; height: auto; cursor: crosshair; }
        .overlay {
            position: absolute; inset: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px);
            display: none; flex-direction: column; align-items: center; justify-content: center;

<body>
    <div class="container">
        <div class="top-bar">
            <a href="./index.html" class="back-link">← All Games</a>
            <div class="top-actions">
                <button class="pill-btn" id="soundToggle" type="button">🔊 Sound</button>
                <button class="pill-btn" id="themeToggle" type="button">🌙 Dark</button>
            </div>
        </div>
        <div class="header">
            <h1>🎯 Sniper Target</h1>
            <div class="stats">
                <div class="stat-box"><div class="stat-label">Score</div><div class="stat-value" id="score">0</div></div>
                <div class="stat-box"><div class="stat-label">Best</div><div class="stat-value" id="bestScore">0</div></div>
                <div class="stat-box"><div class="stat-label">Time</div><div class="stat-value" id="timeLeft">45s</div></div>
                <div class="stat-box"><div class="stat-label">Ammo</div><div class="stat-value" id="ammo">6/6</div></div>
            </div>
        </div>
        <div class="controls-row">
            <span style="font-size:0.84rem;color:var(--text-secondary);">Tap or click targets! Bullseye = +25 pts</span>
            <div style="display:flex;gap:0.45rem;">
                <button class="btn btn-secondary" id="reloadBtn" type="button">Reload (R)</button>
                <button class="btn btn-primary" id="restartBtn" type="button">New Round</button>
            </div>
        </div>
        <div class="canvas-wrap">
            <canvas id="rangeCanvas" width="600" height="380"></canvas>
            <div class="overlay active" id="overlay">
                <h2 id="overlayTitle">Sniper Target Range</h2>
                <p id="overlayMsg">Hit moving targets before time runs out!</p>
                <button class="btn btn-primary" id="startBtn" type="button">Start Range</button>
            </div>
        </div>
        <p class="hint">Click or tap targets to shoot; press R or tap Reload when ammo is low.</p>
    </div>
    <script>
        const canvas = document.getElementById('rangeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('bestScore');
        const timeEl = document.getElementById('timeLeft');
        const ammoEl = document.getElementById('ammo');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const startBtn = document.getElementById('startBtn');
        const reloadBtn = document.getElementById('reloadBtn');
        const restartBtn = document.getElementById('restartBtn');
        const soundToggle = document.getElementById('soundToggle');
        const themeToggle = document.getElementById('themeToggle');

        let score = 0;
        let best = parseInt(localStorage.getItem('mahsua_sniper_best') || '0', 10);
        let timeLeft = 45;
        let ammo = 6;
        let shots = 0;
        let hits = 0;
        let running = false;
        let soundOn = true;
        let targets = [];
        let popups = [];
        let timerId = null;

        bestEl.textContent = best;
        let audioCtx = null;
        function beep(freq, dur = 0.05) {
            if (!soundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.07, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + dur);
            } catch (_) {}
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
        });
        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
        });

        function spawnTarget() {
            const r = 22 + Math.random() * 14;
            const gold = Math.random() < 0.2;
            targets.push({
                x: r + Math.random() * (canvas.width - r * 2),
                y: r + Math.random() * (canvas.height - r * 2),
                vx: (Math.random() < 0.5 ? -1 : 1) * (1.4 + Math.random() * 2.2),
                vy: (Math.random() < 0.5 ? -1 : 1) * (0.8 + Math.random() * 1.4),
                r, gold
            });
        }

        function updateHUD() {
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft + 's';
            ammoEl.textContent = ammo + '/6';
            if (score > best) {
                best = score;
                localStorage.setItem('mahsua_sniper_best', String(best));
                bestEl.textContent = best;
            }
        }

        function reload() {
            if (!running) return;
            ammo = 6;
            beep(320, 0.07);
            updateHUD();
        }

        function startRound() {
            score = 0; timeLeft = 45; ammo = 6; shots = 0; hits = 0;
            targets = []; popups = [];
            for (let i = 0; i < 4; i++) spawnTarget();
            running = true;
            updateHUD();
            overlay.classList.remove('active');
            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                if (!running) return;
                timeLeft--;
                updateHUD();
                if (timeLeft <= 0) {
                    running = false;
                    clearInterval(timerId);
                    const acc = shots ? Math.round((hits / shots) * 100) : 0;
                    overlayTitle.textContent = '⏱️ Time Up!';
                    overlayMsg.textContent = 'Score: ' + score + ' | Accuracy: ' + acc + '%';
                    startBtn.textContent = 'Play Again';
                    overlay.classList.add('active');
                }
            }, 1000);
        }

        startBtn.addEventListener('click', startRound);
        restartBtn.addEventListener('click', startRound);
        reloadBtn.addEventListener('click', reload);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') reload();
        });

        function shootAt(clientX, clientY) {
            if (!running) return;
            if (ammo <= 0) {
                popups.push({ x: canvas.width / 2, y: 36, text: 'RELOAD!', life: 24, color: '#ef4444' });
                beep(160, 0.08);
                return;
            }
            ammo--;
            shots++;
            const rect = canvas.getBoundingClientRect();
            const sx = (clientX - rect.left) * (canvas.width / rect.width);
            const sy = (clientY - rect.top) * (canvas.height / rect.height);

            let hitTarget = false;
            for (let i = targets.length - 1; i >= 0; i--) {
                const t = targets[i];
                const d = Math.hypot(sx - t.x, sy - t.y);
                if (d <= t.r) {
                    hitTarget = true;
                    hits++;
                    const pts = (d <= t.r * 0.4 ? 25 : 10) * (t.gold ? 2 : 1);
                    score += pts;
                    popups.push({ x: t.x, y: t.y, text: '+' + pts, life: 26, color: '#10b981' });
                    targets.splice(i, 1);
                    spawnTarget();
                    beep(d <= t.r * 0.4 ? 780 : 540, 0.06);
                    break;
                }
            }
            if (!hitTarget) beep(220, 0.04);
            updateHUD();
        }

        canvas.addEventListener('mousedown', (e) => shootAt(e.clientX, e.clientY));
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches[0]) shootAt(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });

        function update() {
            if (!running) return;
            for (const t of targets) {
                t.x += t.vx;
                t.y += t.vy;
                if (t.x - t.r < 0 || t.x + t.r > canvas.width) t.vx *= -1;
                if (t.y - t.r < 0 || t.y + t.r > canvas.height) t.vy *= -1;
            }
            for (const p of popups) { p.y -= 1; p.life--; }
            popups = popups.filter(p => p.life > 0);
        }

        function draw() {
            const isDark = document.body.classList.contains('dark');
            ctx.fillStyle = isDark ? '#0f172a' : '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (const t of targets) {
                ctx.fillStyle = t.gold ? '#f59e0b' : '#ec4899';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 0.65, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = t.gold ? '#eab308' : '#3b82f6';
                ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 0.35, 0, Math.PI * 2); ctx.fill();
            }

            ctx.font = '800 18px Outfit, sans-serif';
            ctx.textAlign = 'center';
            for (const p of popups) {
                ctx.globalAlpha = p.life / 26;
                ctx.fillStyle = p.color;
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();
    </script>

<style>

  }
  .mahsua-home-btn {
    background: linear-gradient(135deg, #ec4899, #3b82f6);

  }

    background: linear-gradient(135deg, #10b981, #3b82f6);

  }
</style>
<div id="mahsua-nav-bar">
  <a href="https://games.mahsua.com/" class="mahsua-nav-btn mahsua-home-btn" title="Go to Mahsua Games Home">🏠 Home</a>
  <button type="button" id="mahsuaFsBtn" class="mahsua-nav-btn mahsua-fs-btn" title="Toggle Full Screen">⛶ Full Screen</button>
</div>
<script>
  (function() {
    var fsBtn = document.getElementById('mahsuaFsBtn');
    if (!fsBtn) return;
    function isFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function updateFsLabel() {
      fsBtn.textContent = isFull() ? '✕ Exit Full' : '⛶ Full Screen';
    }
    fsBtn.addEventListener('click', function() {
      var el = document.documentElement;
      if (!isFull()) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    });
    document.addEventListener('fullscreenchange', updateFsLabel);
    document.addEventListener('webkitfullscreenchange', updateFsLabel);
  })();
</script>
