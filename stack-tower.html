    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-gradient: linear-gradient(135deg, #ffe6f0 0%, #e0f3ff 50%, #e6ffe6 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-border: rgba(236, 72, 153, 0.22);
            --text-color: #1e293b;

            --accent-blue: #3b82f6;

            --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);

        body.dark {
            --bg-gradient: linear-gradient(135deg, #1f1024 0%, #0f172a 50%, #0b221a 100%);
            --card-bg: rgba(30, 41, 59, 0.92);
            --card-border: rgba(236, 72, 153, 0.3);
            --text-color: #f8fafc;

            --shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
        }
        body {

            min-height: 100vh;
            display: flex;
            flex-direction: column;

        .top-bar {

        .top-actions { display: flex; gap: 0.4rem; }

        body.dark .mahsua-fs-inline { color: #34d399 !important; }
        .header {
            display: flex;

        h1 {

        .scores { display: flex; gap: 0.45rem; }
        .score-box {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.12), rgba(59, 130, 246, 0.12));
            border: 1px solid var(--card-border);

        .score-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); }
        .score-value { font-size: 1.05rem; font-weight: 800; }
        .canvas-wrap {
            position: relative;
            width: 100%;
            border-radius: 18px;

            border: 2px solid var(--card-border);
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(4px);

        .overlay.active { display: flex; }
        .overlay h2 { font-size: 1.75rem; font-weight: 800; }

            border: none;
            border-radius: 12px;

            backdrop-filter: blur(10px);

        body.mahsua-fullscreen #mahsua-exit-fs { display: inline-flex; align-items: center; gap: 5px; }
        body.mahsua-fullscreen { padding: 0 !important; margin: 0 !important; overflow: hidden !important; }
        body.mahsua-fullscreen .top-bar, body.mahsua-fullscreen .hint { display: none !important; }
        body.mahsua-fullscreen .container {
            position: fixed !important; inset: 0 !important;
            width: 100vw !important; height: 100dvh !important;
            max-width: 100vw !important; max-height: 100dvh !important;
            margin: 0 !important; border-radius: 0 !important; border: none !important;
            padding: 56px 12px 16px !important; z-index: 9998 !important;
            display: flex !important; flex-direction: column !important; justify-content: center !important;
        }
        body.mahsua-fullscreen .canvas-wrap {
            flex: 1 1 auto !important; min-height: 0 !important;
            display: flex !important; align-items: center !important; justify-content: center !important;
        }
        body.mahsua-fullscreen canvas {
            max-height: calc(100dvh - 150px) !important;
            width: auto !important; max-width: 100% !important; margin: 0 auto !important;

<body>
    <div class="container">
        <div class="top-bar">
            <a href="https://games.mahsua.com/" class="back-link">🏠 Home</a>
            <div class="top-actions">
                <button class="pill-btn mahsua-fs-inline" type="button">⛶ Fullscreen</button>
                <button class="pill-btn" id="soundToggle" type="button">🔊 Sound</button>
                <button class="pill-btn" id="themeToggle" type="button">🌙 Dark</button>
            </div>
        </div>

        <div class="header">
            <h1>🗼 Stack Tower</h1>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="bestScore">0</div>
                </div>
            </div>
        </div>

        <div class="canvas-wrap">
            <canvas id="stackCanvas" width="380" height="520"></canvas>
            <div class="overlay active" id="overlay">
                <h2 id="overlayTitle">Stack Tower</h2>
                <p id="overlayMsg">Tap or press Space to drop each block cleanly on the tower!</p>
                <button class="btn-primary" id="startBtn" type="button">Start Stacking</button>
            </div>
        </div>

        <p class="hint">Tap screen (mobile) or click / press Space (desktop) to drop blocks.</p>
    </div>

    <button type="button" id="mahsua-exit-fs">✕ Exit Fullscreen</button>

    <script>
        const canvas = document.getElementById('stackCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('bestScore');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const startBtn = document.getElementById('startBtn');
        const soundToggle = document.getElementById('soundToggle');
        const themeToggle = document.getElementById('themeToggle');

        const BLOCK_H = 26;
        const BASE_W = 200;
        const PALETTE = ['#ec4899', '#8b5cf6', '#3b82f6', '#06b6d4', '#10b981', '#f59e0b'];

        let stack = [];
        let moving = null;
        let debris = [];
        let popups = [];
        let cameraY = 0;
        let targetCameraY = 0;
        let score = 0;
        let combo = 0;
        let best = parseInt(localStorage.getItem('mahsua_stack_best') || '0', 10);
        let state = 'ready'; // ready | playing | over
        let soundOn = true;

        bestEl.textContent = best;

        let audioCtx = null;
        function beep(freq, dur = 0.06, type = 'sine') {
            if (!soundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = type;
                o.frequency.value = freq;
                g.gain.setValueAtTime(0.07, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + dur);
            } catch (_) {}
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
        });

        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
        });

        function spawnMoving() {
            const top = stack[stack.length - 1];
            const level = stack.length;
            const dir = level % 2 === 1 ? 1 : -1;
            const speed = Math.min(7.5, 2.8 + level * 0.14);
            moving = {
                x: dir === 1 ? -top.w : canvas.width,
                y: top.y - BLOCK_H,
                w: top.w,
                vx: dir * speed,
                color: PALETTE[level % PALETTE.length]
            };
        }

        function startGame() {
            stack = [{
                x: (canvas.width - BASE_W) / 2,
                y: canvas.height - 60,
                w: BASE_W,
                color: PALETTE[0]
            }];
            debris = [];
            popups = [];
            cameraY = 0;
            targetCameraY = 0;
            score = 0;
            combo = 0;
            scoreEl.textContent = '0';
            state = 'playing';
            overlay.classList.remove('active');
            spawnMoving();
        }

        function dropBlock() {
            if (state !== 'playing' || !moving) return;
            const top = stack[stack.length - 1];
            const diff = moving.x - top.x;

            // Check complete miss
            if (Math.abs(diff) >= moving.w) {
                debris.push({ x: moving.x, y: moving.y, w: moving.w, vy: 1, color: moving.color });
                moving = null;
                state = 'over';
                beep(170, 0.2, 'sawtooth');
                if (score > best) {
                    best = score;
                    localStorage.setItem('mahsua_stack_best', String(best));
                    bestEl.textContent = best;
                }
                overlayTitle.textContent = 'Tower Toppled!';
                overlayMsg.textContent = 'Score: ' + score + ' | Best: ' + best;
                startBtn.textContent = 'Play Again';
                overlay.classList.add('active');
                return;
            }

            // Perfect snap within 5px
            if (Math.abs(diff) <= 5) {
                combo++;
                const bonus = combo >= 2 ? 2 : 1;
                score += bonus;
                stack.push({ x: top.x, y: moving.y, w: top.w, color: moving.color });
                popups.push({
                    x: top.x + top.w / 2,
                    y: moving.y - 10,
                    text: combo >= 2 ? 'PERFECT x' + combo + '!' : 'PERFECT!',
                    life: 28
                });
                beep(520 + Math.min(400, combo * 45), 0.08);
            } else {
                combo = 0;
                score += 1;
                const overlapX = Math.max(moving.x, top.x);
                const overlapW = moving.w - Math.abs(diff);
                stack.push({ x: overlapX, y: moving.y, w: overlapW, color: moving.color });

                // Falling sliced overhang
                const sliceX = diff > 0 ? overlapX + overlapW : moving.x;
                const sliceW = Math.abs(diff);
                debris.push({ x: sliceX, y: moving.y, w: sliceW, vy: 1, color: moving.color });
                beep(420, 0.05, 'triangle');
            }

            scoreEl.textContent = score;
            if (stack.length > 7) {
                targetCameraY = (stack.length - 7) * BLOCK_H;
            }
            spawnMoving();
        }

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });
        canvas.addEventListener('mousedown', dropBlock);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dropBlock();
        }, { passive: false });
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 'Enter') {
                e.preventDefault();
                if (state === 'ready' || state === 'over') startGame();
                else dropBlock();
            }
        });

        function update() {
            cameraY += (targetCameraY - cameraY) * 0.12;

            if (state === 'playing' && moving) {
                moving.x += moving.vx;
                if (moving.x + moving.w >= canvas.width + 40 && moving.vx > 0) moving.vx *= -1;
                if (moving.x <= -40 && moving.vx < 0) moving.vx *= -1;
            }

            for (const d of debris) {
                d.y += d.vy;
                d.vy += 0.45;
            }
            debris = debris.filter(d => d.y - cameraY < canvas.height + 60);

            for (const p of popups) {
                p.y -= 1;
                p.life--;
            }
            popups = popups.filter(p => p.life > 0);
        }

        function drawBlock(x, y, w, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x, y, w, BLOCK_H - 2, 6);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.fillRect(x + 3, y + 2, Math.max(0, w - 6), 5);
        }

        function draw() {
            const isDark = document.body.classList.contains('dark');
            ctx.fillStyle = isDark ? '#0f172a' : '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(0, cameraY);

            for (const b of stack) drawBlock(b.x, b.y, b.w, b.color);
            if (moving) drawBlock(moving.x, moving.y, moving.w, moving.color);
            for (const d of debris) drawBlock(d.x, d.y, d.w, d.color);

            ctx.font = '800 16px Outfit, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#10b981';
            for (const p of popups) {
                ctx.globalAlpha = p.life / 28;
                ctx.fillText(p.text, p.x, p.y);
            }
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }
        loop();

        // Fullscreen handler
        (function() {
            const fsBtn = document.querySelector('.mahsua-fs-inline');
            const exitBtn = document.getElementById('mahsua-exit-fs');
            function isNativeFull() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            }
            function enterFull() {
                document.body.classList.add('mahsua-fullscreen');
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
            }
            function exitFull() {
                document.body.classList.remove('mahsua-fullscreen');
                if (isNativeFull()) {
                    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }
            if (fsBtn) fsBtn.addEventListener('click', () => {
                if (document.body.classList.contains('mahsua-fullscreen') || isNativeFull()) exitFull();
                else enterFull();
            });
            if (exitBtn) exitBtn.addEventListener('click', exitFull);
            document.addEventListener('fullscreenchange', () => {
                if (!isNativeFull()) document.body.classList.remove('mahsua-fullscreen');
            });
        })();
    </script>
</body>
