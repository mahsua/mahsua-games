    <script>
        const canvas = document.getElementById('tennisCanvas');
        const ctx = canvas.getContext('2d');
        const playerScoreEl = document.getElementById('playerScore');
        const aiScoreEl = document.getElementById('aiScore');
        const difficultyEl = document.getElementById('difficulty');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayMsg = document.getElementById('overlayMsg');
        const startBtn = document.getElementById('startBtn');
        const soundToggle = document.getElementById('soundToggle');
        const themeToggle = document.getElementById('themeToggle');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        const WIN_SCORE = 7;
        const RACKET_W = 86;
        const RACKET_H = 14;
        const BALL_R = 9;

        let soundOn = true;
        let running = false;
        let paused = false;
        let playerScore = 0;
        let aiScore = 0;

        const player = { x: canvas.width / 2 - RACKET_W / 2, y: canvas.height - 34 };
        const ai = { x: canvas.width / 2 - RACKET_W / 2, y: 20 };
        const ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 3, vy: 5 };
        const keys = { left: false, right: false };

        let audioCtx = null;
        function beep(freq, dur = 0.06) {
            if (!soundOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch (_) {}
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            themeToggle.textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
        });

        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            soundToggle.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
        });

        function resetBall(dirY = 1) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            const speed = 5.4;
            const angle = Math.random() * 0.7 - 0.35;
            ball.vx = speed * Math.sin(angle);
            ball.vy = dirY * speed * Math.cos(angle);
        }

        function startMatch() {
            playerScore = 0;
            aiScore = 0;
            playerScoreEl.textContent = '0';
            aiScoreEl.textContent = '0';
            player.x = canvas.width / 2 - RACKET_W / 2;
            ai.x = canvas.width / 2 - RACKET_W / 2;
            resetBall(1);
            running = true;
            paused = false;
            pauseBtn.textContent = 'Pause';
            overlay.classList.remove('active');
        }

        pauseBtn.addEventListener('click', () => {
            if (!running) return;
            paused = !paused;
            pauseBtn.textContent = paused ? 'Resume' : 'Pause';
        });

        restartBtn.addEventListener('click', startMatch);
        startBtn.addEventListener('click', startMatch);

        function moveRacketTo(clientX) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const x = (clientX - rect.left) * scaleX - RACKET_W / 2;
            player.x = Math.max(18, Math.min(canvas.width - 18 - RACKET_W, x));
        }

        canvas.addEventListener('mousemove', (e) => {
            if (running && !paused) moveRacketTo(e.clientX);
        });
        canvas.addEventListener('touchmove', (e) => {
            if (running && !paused && e.touches[0]) moveRacketTo(e.touches[0].clientX);
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); keys.left = true; }
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); keys.right = true; }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
        });

        leftBtn.addEventListener('touchstart', () => keys.left = true, { passive: true });
        leftBtn.addEventListener('touchend', () => keys.left = false, { passive: true });
        rightBtn.addEventListener('touchstart', () => keys.right = true, { passive: true });
        rightBtn.addEventListener('touchend', () => keys.right = false, { passive: true });
        leftBtn.addEventListener('mousedown', () => keys.left = true);
        leftBtn.addEventListener('mouseup', () => keys.left = false);
        rightBtn.addEventListener('mousedown', () => keys.right = true);
        rightBtn.addEventListener('mouseup', () => keys.right = false);

        function update() {
            if (!running || paused) return;

            const speed = 6.8;
            if (keys.left) player.x -= speed;
            if (keys.right) player.x += speed;
            player.x = Math.max(18, Math.min(canvas.width - 18 - RACKET_W, player.x));

            const aiSpeeds = { easy: 3.1, medium: 4.8, hard: 6.4 };
            const aiSpeed = aiSpeeds[difficultyEl.value];
            const aiCenter = ai.x + RACKET_W / 2;
            if (aiCenter < ball.x - 10) ai.x += aiSpeed;
            else if (aiCenter > ball.x + 10) ai.x -= aiSpeed;
            ai.x = Math.max(18, Math.min(canvas.width - 18 - RACKET_W, ai.x));

            ball.x += ball.vx;
            ball.y += ball.vy;

            // Side walls
            if (ball.x - BALL_R < 18) {
                ball.x = 18 + BALL_R;
                ball.vx *= -1;
                beep(320);
            } else if (ball.x + BALL_R > canvas.width - 18) {
                ball.x = canvas.width - 18 - BALL_R;
                ball.vx *= -1;
                beep(320);
            }

            // Player racket hit
            if (ball.vy > 0 &&
                ball.y + BALL_R >= player.y &&
                ball.y - BALL_R <= player.y + RACKET_H &&
                ball.x + BALL_R >= player.x &&
                ball.x - BALL_R <= player.x + RACKET_W) {
                const hit = (ball.x - (player.x + RACKET_W / 2)) / (RACKET_W / 2);
                const spd = Math.min(10.5, Math.hypot(ball.vx, ball.vy) * 1.04);
                const angle = hit * (Math.PI / 3);
                ball.vx = spd * Math.sin(angle);
                ball.vy = -spd * Math.cos(angle);
                ball.y = player.y - BALL_R;
                beep(540);
            }

            // AI racket hit
            if (ball.vy < 0 &&
                ball.y - BALL_R <= ai.y + RACKET_H &&
                ball.y + BALL_R >= ai.y &&
                ball.x + BALL_R >= ai.x &&
                ball.x - BALL_R <= ai.x + RACKET_W) {
                const hit = (ball.x - (ai.x + RACKET_W / 2)) / (RACKET_W / 2);
                const spd = Math.min(10.5, Math.hypot(ball.vx, ball.vy) * 1.04);
                const angle = hit * (Math.PI / 3);
                ball.vx = spd * Math.sin(angle);
                ball.vy = spd * Math.cos(angle);
                ball.y = ai.y + RACKET_H + BALL_R;
                beep(460);
            }

            // Point scored
            if (ball.y - BALL_R > canvas.height) {
                aiScore++;
                aiScoreEl.textContent = aiScore;
                beep(210, 0.14);
                checkWin() || resetBall(-1);
            } else if (ball.y + BALL_R < 0) {
                playerScore++;
                playerScoreEl.textContent = playerScore;
                beep(700, 0.12);
                checkWin() || resetBall(1);
            }
        }

        function checkWin() {
            if (playerScore >= WIN_SCORE || aiScore >= WIN_SCORE) {
                running = false;
                overlayTitle.textContent = playerScore >= WIN_SCORE ? '🏆 Match Won!' : '🤖 AI Wins!';
                overlayMsg.textContent = 'Final Score: ' + playerScore + ' - ' + aiScore;
                startBtn.textContent = 'Play Again';
                overlay.classList.add('active');
                return true;
            }
            return false;
        }

        function draw() {
            // Court background
            ctx.fillStyle = '#059669';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Outer court lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.lineWidth = 3;
            ctx.strokeRect(18, 12, canvas.width - 36, canvas.height - 24);

            // Singles sidelines & service lines
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(54, 12);
            ctx.lineTo(54, canvas.height - 12);
            ctx.moveTo(canvas.width - 54, 12);
            ctx.lineTo(canvas.width - 54, canvas.height - 12);
            ctx.moveTo(54, canvas.height * 0.28);
            ctx.lineTo(canvas.width - 54, canvas.height * 0.28);
            ctx.moveTo(54, canvas.height * 0.72);
            ctx.lineTo(canvas.width - 54, canvas.height * 0.72);
            ctx.moveTo(canvas.width / 2, canvas.height * 0.28);
            ctx.lineTo(canvas.width / 2, canvas.height * 0.72);
            ctx.stroke();

            // Net
            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(12, canvas.height / 2);
            ctx.lineTo(canvas.width - 12, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Player racket (pink)
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, RACKET_W, RACKET_H, 7);
            ctx.fill();

            // AI racket (blue)
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.roundRect(ai.x, ai.y, RACKET_W, RACKET_H, 7);
            ctx.fill();

            // Tennis ball (lime yellow)
            ctx.fillStyle = '#fde047';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

<script>
  (function() {
    var fsBtns = document.querySelectorAll('.mahsua-fs-inline, #mahsuaFsBtn');
    var exitBtn = document.getElementById('mahsua-exit-fs');
    function isNativeFull() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }
    function enterFull() {
      document.body.classList.add('mahsua-fullscreen');
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }
    function exitFull() {
      document.body.classList.remove('mahsua-fullscreen');
      if (isNativeFull()) {
        if (document.exitFullscreen) document.exitFullscreen().catch(function(){});
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
    fsBtns.forEach(function(b) {
      b.addEventListener('click', function() {
        if (document.body.classList.contains('mahsua-fullscreen') || isNativeFull()) exitFull();
        else enterFull();
      });
    });
    if (exitBtn) exitBtn.addEventListener('click', exitFull);
    function onNativeChange() {
      if (!isNativeFull()) document.body.classList.remove('mahsua-fullscreen');
    }
    document.addEventListener('fullscreenchange', onNativeChange);
    document.addEventListener('webkitfullscreenchange', onNativeChange);
  })();
</script>
</body>
</html>
